<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>issboard</title>
<link rel="stylesheet" href="nothing.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="n-appbg"></div>

<div class="page">

  <header class="top">
    <div class="top-id">
      <h1 class="brand">issboard</h1>
      <span id="host-pill" class="n-pill" hidden></span>
      <span id="demo-pill" class="n-pill n-pill-warn" hidden>data palsu</span>
    </div>
    <div class="top-act">
      <span id="updated" class="n-label">memuat…</span>
      <button id="theme" class="n-btn" type="button" title="ganti tema">tema</button>
    </div>
  </header>

  <!-- Kartu hero: satu jawaban untuk pertanyaan yang sebenarnya dicari
       saat halaman ini dibuka sambil lewat — ada yang perlu diurus atau tidak. -->
  <section id="hero" class="n-card n-card-black hero n-fade-in">
    <span class="n-label">status host</span>
    <div id="verdict" class="verdict"><p class="vtext">memuat…</p></div>
    <ul id="findings" class="findings"></ul>
  </section>

  <!-- Satu kartu, bukan lima. Metrik host saling menjelaskan — CPU tinggi
       bersama swap terisi bercerita lain daripada CPU tinggi sendirian —
       jadi memisahkannya jadi kartu-kartu kecil justru memutus bacaannya. -->
  <h2 class="n-label section">host</h2>
  <div id="host"></div>

  <h2 class="n-label section">pool zfs</h2>
  <div id="pools" class="bento"></div>

  <h2 class="n-label section">disk — smart</h2>
  <p id="smart-note" class="note"></p>
  <div id="disks" class="bento"></div>

  <h2 class="n-label section">container</h2>
  <div id="containers" class="bento bento-wide"></div>

  <h2 class="n-label section">dataset</h2>
  <div id="datasets" class="bento bento-wide"></div>

  <p id="errors" class="note" hidden></p>

  <footer class="foot n-label">
    issboard — dashboard kesehatan host. Data dikumpulkan hanya selama halaman ini terbuka.
  </footer>

</div>

<script src="app.js"></script>
</body>
</html>
