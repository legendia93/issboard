# Contoh konfigurasi issboard. Salin ke /etc/issboard.yaml.
#
# File ini SENGAJA generik — repo ini publik. Jangan pernah menaruh hostname,
# alamat IP, atau nama pool milik mesin nyata di sini.

# Hanya dipakai kalau dijalankan TANPA socket activation (mis. saat mengembangkan).
# Di produksi alamatnya ditentukan issboard.socket.
listen: 127.0.0.1:9955

# Proses keluar sendiri setelah sekian lama tanpa request; systemd
# menyalakannya lagi lewat socket. 0 = jangan pernah keluar.
idle_timeout: 5m

# Ditulis oleh issboard-smart.timer sebagai root. issboard hanya membacanya.
smart_cache: /var/cache/issboard/smart.json

# Dibaca read-only untuk daftar container.
# Podman: /run/podman/podman.sock — API-nya kompatibel, tapi BELUM DIUJI.
docker_socket: /var/run/docker.sock

# Data palsu, sistem tidak disentuh sama sekali. Berguna untuk mencoba
# tampilan, dan untuk screenshot/rekaman layar yang aman dibagikan —
# halaman sebenarnya menampilkan hostname, alamat IP, dan nama pool.
# Bisa juga lewat flag: ./issboard -demo
# demo: true

# Kosongkan untuk mendeteksi semua pool otomatis, atau daftar dipisah koma.
# pools: pool-satu, pool-dua

# --- Kebijakan snapshot ---------------------------------------------------
#
# Berkas konfigurasi sanoid, dibandingkan dengan dataset yang benar-benar ada.
# Menjawab dua hal yang tidak muncul sendiri di layar mana pun: dataset yang
# tidak tercakup aturan apa pun, dan dataset yang tercakup tapi snapshot-nya
# sudah berhenti.
#
# Berkas yang TIDAK ADA mematikan seluruh aturan ini — itu perilaku yang benar
# untuk mesin yang memang tidak memakai snapshot terkelola. issboard hanya
# MEMBACA berkasnya; ia tidak pernah memanggil sanoid dan tidak pernah membuat
# snapshot.
snapshot_policy: /etc/sanoid/sanoid.conf

# Dataset yang memang tidak perlu tercakup: scratch, rekaman CCTV, apa pun yang
# dilindungi cara lain. Pola `pool/data/*` ikut mencakup keturunannya; tanpa
# `/*` yang cocok hanya dataset itu sendiri.
#
# Ini ada supaya satu temuan bisa dimatikan dengan sadar. Tanpa jalan itu,
# orang mematikan SELURUH daftar temuannya.
# snapshot_exempt: kolam/rekaman/*, kolam/scratch

# --- issboard-agent (unit bertimer terpisah) ------------------------------
#
# Hanya dipakai issboard-agent. issboard sendiri tidak pernah mengirim apa pun:
# prosesnya tidak hidup saat halamannya tidak dibuka, jadi ia secara desain
# tidak bisa jadi sumber alert. Yang mengirim adalah unit bertimer terpisah.

# Ditulis agent tiap menit, DIBACA issboard untuk sparkline — pola yang sama
# dengan cache SMART, dan alasan yang sama: tidak ada daemon yang menyala terus.
history_file: /var/lib/issboard/history.json

# Ingatan "sudah dikabari". Tanpa ini, disk dengan reallocated sector akan
# mengirim notifikasi yang sama tiap menit selamanya.
alert_state: /var/lib/issboard/alert-state.json

# Jeda diam sebelum temuan yang MASIH ada dikabari lagi. Bukan untuk mendesak,
# tapi supaya masalah menahun tidak hilang sepenuhnya dari ingatan.
alert_repeat: 24h

# warn = semua temuan; crit = hanya yang kritis.
notify_min_level: warn

# Kanal notifikasi. Boleh dua-duanya, boleh tidak sama sekali.
#
# ⚠️ JANGAN menaruh token di berkas ini — berkas ini dibaca dashboard dan
# biasanya boleh dibaca siapa saja. Pakai /etc/issboard/agent.env yang mode
# 0600; lihat issboard-agent.env.example.
# ntfy_url: https://ntfy.sh
# ntfy_topic: ganti-dengan-topik-acak-yang-panjang
